name: Release macOS companion

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git show "$release_commit:Cargo.toml" > /tmp/agentrelay-release.toml
          release_version=$(python3 -c 'import tomllib; print(tomllib.load(open("/tmp/agentrelay-release.toml", "rb"))["package"]["version"])')
          test "$RELEASE_TAG" = "v$release_version"
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$RELEASE_TAG" "$release_version" "$release_commit" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo fmt --check
      - run: cargo test --all-targets --locked --target '${{ matrix.target }}'
      - run: cargo clippy --all-targets --locked --target '${{ matrix.target }}' -- -D warnings
      - run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Package and smoke-test the exact release binary
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/package-macos.sh "$RELEASE_VERSION" "$RELEASE_ARCH" "target/$RELEASE_TARGET/release/agentrelay" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - name: Verify artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && cat ./*.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS)
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/agentrelay-existing-release.json 2>/dev/null; then
            jq -e '.isDraft == true' /tmp/agentrelay-existing-release.json >/dev/null || {
              echo 'Published releases are immutable; create a new version tag.' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AgentRelay $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
