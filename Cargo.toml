[package]
name = "agent-relay"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "External CLI runtimes for native Codex agents"
license = "MIT"
readme = "readme.md"

[[bin]]
name = "agentrelay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "blocking"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "signal", "time", "net", "sync"] }
toml = "0.9"
toml_edit = "0.23"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
